rule_id: "RULE-001"
rule_name: "Repeated Failed Authentication (Brute Force)"
description: "Detects repeated failed logon attempts targeting accounts from single or distributed sources within a time window. Validates whether subsequent successful authentication originates from the same source IP before inferring credential compromise."
enabled: true
required_fields:
  - "timestamp"
  - "event_category"
  - "event_outcome"
  - "winlog_event_id"
  - "host_name"
  - "username"
  - "source_ip"
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
detection_logic: "brute_force_handler"
threshold:
  min_failures: 3
time_window: "300s"
mitre_technique_id: "T1110"
mitre_technique_name: "Brute Force"
mitre_tactic: "Credential Access"
kill_chain_stage: "Exploitation"
severity: "medium"
evidence_requirements:
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
  - "source_ip"
  - "target_host"
  - "failed_attempts"
parameters:
  check_subsequent_success: true
  min_failures_high_confidence: 6
