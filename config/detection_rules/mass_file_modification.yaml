rule_id: "RULE-005"
rule_name: "Suspicious File Rename Activity (Ransomware Pattern)"
description: "Detects rapid file rename activity with uniform or ransomware-associated extensions (.locked). Telemetry captures rename actions; encryption cannot be independently established without file content or entropy telemetry."
enabled: true
required_fields:
  - "timestamp"
  - "event_category"
  - "host_name"
  - "username"
  - "process_name"
  - "file_path"
  - "file_extension"
  - "event_action"
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
detection_logic: "mass_file_modification_handler"
threshold:
  min_files: 2
time_window: "300s"
mitre_technique_id: "T1486"
mitre_technique_name: "Data Encrypted for Impact"
mitre_tactic: "Impact"
kill_chain_stage: "Actions on Objectives"
severity: "critical"
evidence_requirements:
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
  - "file_path"
  - "file_extension"
  - "process_name"
  - "affected_file_count"
parameters:
  ransom_extensions:
    - "locked"
    - "crypto"
    - "enc"
    - "crypted"
    - "ransom"
    - "wncry"
  suspicious_actions:
    - "file_rename"
    - "file_modified"
