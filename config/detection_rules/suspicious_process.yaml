rule_id: "RULE-002"
rule_name: "Office Application Spawning PowerShell"
description: "Detects Microsoft Office applications (Word, Excel, Outlook, PowerPoint) spawning PowerShell or pwsh interpreters."
enabled: true
required_fields:
  - "timestamp"
  - "event_category"
  - "host_name"
  - "username"
  - "process_name"
  - "parent_process_name"
  - "process_command_line"
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
detection_logic: "suspicious_process_handler"
threshold:
  min_events: 1
time_window: "60s"
mitre_technique_id: "T1059.001"
mitre_technique_name: "Command and Scripting Interpreter: PowerShell"
mitre_tactic: "Execution"
kill_chain_stage: "Exploitation"
severity: "high"
evidence_requirements:
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
  - "parent_process_name"
  - "child_process_name"
  - "process_command_line"
parameters:
  parent_processes:
    - "winword.exe"
    - "excel.exe"
    - "outlook.exe"
    - "powerpnt.exe"
  child_processes:
    - "powershell.exe"
    - "pwsh.exe"
  stealth_flags:
    - "-enc"
    - "-nop"
    - "-w hidden"
    - "-windowstyle hidden"
