rule_id: "RULE-003"
rule_name: "C2 Beaconing / Repeated Outbound Network Connections"
description: "Detects repeated, periodic outbound network connections initiated by scripting engines or non-browser processes to external destinations. Requires sufficient observations and interval consistency to distinguish periodic beaconing from isolated bursts."
enabled: true
required_fields:
  - "timestamp"
  - "event_category"
  - "host_name"
  - "destination_ip"
  - "destination_domain"
  - "process_name"
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
detection_logic: "c2_beaconing_handler"
threshold:
  min_connections: 3
time_window: "600s"
mitre_technique_id: "T1071.001"
mitre_technique_name: "Application Layer Protocol: Web Protocols"
mitre_tactic: "Command and Control"
kill_chain_stage: "Command and Control"
severity: "high"
evidence_requirements:
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
  - "destination_ip"
  - "destination_domain"
  - "process_name"
  - "connection_count"
parameters:
  min_interval_seconds: 1.0
  suspicious_processes:
    - "powershell.exe"
    - "pwsh.exe"
    - "cmd.exe"
    - "unknown.exe"
    - "rundll32.exe"
    - "cscript.exe"
    - "wscript.exe"
  exclude_benign_domains:
    - "login.microsoftonline.com"
    - "outlook.office365.com"
    - "www.google.com"
    - "teams.microsoft.com"
    - "github.com"
    - "update.microsoft.com"
    - "slack.com"
    - "s3.amazonaws.com"
    - "zoom.us"
