rule_id: "RULE-004"
rule_name: "Registry Autorun Key Persistence Modification"
description: "Detects modifications or additions to Windows autostart/Run keys typically used by adversaries to establish persistence."
enabled: true
required_fields:
  - "timestamp"
  - "event_category"
  - "host_name"
  - "username"
  - "process_name"
  - "registry_path"
  - "registry_data"
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
detection_logic: "registry_persistence_handler"
threshold:
  min_events: 1
time_window: "300s"
mitre_technique_id: "T1547.001"
mitre_technique_name: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder"
mitre_tactic: "Persistence"
kill_chain_stage: "Installation"
severity: "high"
evidence_requirements:
  - "event_id"
  - "raw_file"
  - "byte_offset"
  - "record_length"
  - "registry_path"
  - "registry_data"
  - "process_name"
parameters:
  key_patterns:
    - "%CurrentVersion\\Run%"
    - "%CurrentVersion\\RunOnce%"
    - "%CurrentVersion\\Explorer\\User Shell Folders%"
  suspicious_processes:
    - "powershell.exe"
    - "pwsh.exe"
    - "cmd.exe"
    - "unknown.exe"
    - "reg.exe"
